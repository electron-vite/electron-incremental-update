<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron Incremental Update Playground</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f8fb;
        color: #1c2430;
      }

      main {
        display: grid;
        gap: 20px;
        margin: 0 auto;
        max-width: 760px;
        padding: 48px 24px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
      }

      .panel {
        border: 1px solid #d9dee8;
        border-radius: 8px;
        background: #fff;
        padding: 20px;
      }

      .status {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .status strong {
        font-size: 18px;
      }

      .badge {
        border-radius: 999px;
        background: #e8eef8;
        color: #264366;
        font-size: 13px;
        padding: 4px 10px;
      }

      progress {
        display: block;
        height: 18px;
        margin: 18px 0 8px;
        width: 100%;
      }

      .meta {
        color: #647084;
        font-size: 13px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 1px solid #b9c2d0;
        border-radius: 6px;
        background: #fff;
        color: #1c2430;
        cursor: pointer;
        font: inherit;
        min-height: 36px;
        padding: 0 14px;
      }

      button.primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #fff;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Incremental Update Playground</h1>
        <p class="meta">Local update resources are generated automatically during dev startup.</p>
      </section>

      <section class="panel">
        <div class="status">
          <strong id="status">Waiting</strong>
          <span class="badge" id="mode">Unknown</span>
        </div>
        <div class="meta" id="version-meta">App version unknown</div>
        <progress id="progress" max="100" value="0"></progress>
        <div class="meta" id="progress-meta">0% downloaded</div>
      </section>

      <section class="actions">
        <button id="check" type="button">Check</button>
        <button class="primary" disabled id="download" type="button">Download</button>
        <button disabled id="restart" type="button">Restart</button>
      </section>

      <section class="panel">
        <pre id="log"></pre>
      </section>
    </main>
  </body>
  <script>
    const status = document.querySelector('#status')
    const mode = document.querySelector('#mode')
    const progress = document.querySelector('#progress')
    const progressMeta = document.querySelector('#progress-meta')
    const versionMeta = document.querySelector('#version-meta')
    const log = document.querySelector('#log')
    const checkButton = document.querySelector('#check')
    const downloadButton = document.querySelector('#download')
    const restartButton = document.querySelector('#restart')

    function appendLog(entry) {
      log.textContent = `${log.textContent}\n${new Date().toLocaleTimeString()} ${JSON.stringify(entry)}`
    }

    function setBusy(isBusy) {
      checkButton.disabled = isBusy
      downloadButton.disabled = isBusy || downloadButton.dataset.enabled !== 'true'
    }

    function applyState(state) {
      appendLog(state)
      mode.textContent = state.enabled === false ? 'Disabled' : 'Local update'
      status.textContent = state.status || 'Waiting'

      if (['ready', 'not-available', 'error', 'disabled'].includes(state.status)) {
        downloadButton.dataset.enabled = 'false'
        downloadButton.disabled = true
        restartButton.disabled = true
      }
      if (['ready', 'not-available', 'error', 'disabled', 'available'].includes(state.status)) {
        progress.value = 0
        progressMeta.textContent = '0% downloaded'
      }
      if (state.progress) {
        progress.value = state.progress.percent
        progressMeta.textContent = `${state.progress.percent}% downloaded (${state.progress.transferred}/${state.progress.total} bytes)`
      }
      if (state.appVersion || state.entryVersion) {
        versionMeta.textContent = `App ${state.appVersion || 'unknown'} · Entry ${state.entryVersion || 'unknown'}`
      }

      if (state.status === 'available') {
        downloadButton.dataset.enabled = 'true'
        downloadButton.disabled = false
      }
      if (state.status === 'downloaded') {
        restartButton.disabled = false
        downloadButton.disabled = true
      }
      if (state.status === 'checking' || state.status === 'downloading') {
        setBusy(true)
      }
      if (
        ['available', 'downloaded', 'not-available', 'error', 'ready', 'disabled'].includes(
          state.status,
        )
      ) {
        checkButton.disabled = false
      }
    }

    checkButton.addEventListener('click', () => window.electron.update.check())
    downloadButton.addEventListener('click', () => window.electron.update.download())
    restartButton.addEventListener('click', () => window.electron.update.restart())
    window.electron.update.onState(applyState)
  </script>
</html>
